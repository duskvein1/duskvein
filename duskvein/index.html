<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title># duskvein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#000000;
    --bg-1:#0a0a0a;
    --card:rgba(255,255,255,0.03);
    --border:rgba(255,255,255,0.10);
    --text:#f4f4f4;
    --text-dim:#7a7a7a;
    --accent:#ffffff;
    --accent-soft:#b9b9b9;
    --glow:rgba(255,255,255,0.28);
  }
 
  *{margin:0;padding:0;box-sizing:border-box;}
 
  html,body{
    height:100%;
    background:var(--bg-0);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
 
  #stars{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
  }
 
  .vignette{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 760px 520px at 18% 18%, rgba(255,255,255,.05), transparent 68%),
      radial-gradient(ellipse 680px 480px at 82% 72%, rgba(255,255,255,.035), transparent 70%),
      radial-gradient(ellipse 420px 420px at 50% 42%, rgba(255,255,255,.04), transparent 72%),
      radial-gradient(ellipse 1250px 1100px at 50% 50%, transparent 32%, #000 84%);
  }
 
  .page{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }
 
  .card{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    padding:40px 40px 28px;
    box-shadow:0 40px 100px -20px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.02) inset;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
 
  @keyframes rise{
    from{opacity:0; transform:translateY(18px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
 
  .ring-wrap{
    position:relative;
    width:248px;
    height:248px;
    margin:0 auto 24px;
  }

  .avatar{
    position:absolute;
    inset:12px;
    border-radius:50%;
    overflow:hidden;
    background:#0c0c0c;
    box-shadow:0 0 0 4px #090909, 0 0 0 6px rgba(255,255,255,.10), 0 18px 55px rgba(0,0,0,.65);
    z-index:2;
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
 
  .identity{
    text-align:center;
    margin-bottom:24px;
  }
 
  .username{
    font-family:'Unbounded',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    color:var(--text);
  }
 
  .status-dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#747f8d;
    box-shadow:0 0 10px #747f8d;
    margin-inline-end:9px;
    vertical-align:middle;
    transition:background .3s ease, box-shadow .3s ease;
  }
 
  .status-dot.online{ background:#3ba55c; box-shadow:0 0 10px #3ba55c; animation:pulse 1.8s ease-in-out infinite; }
  .status-dot.idle{ background:#faa61a; box-shadow:0 0 10px #faa61a; animation:pulse 1.8s ease-in-out infinite; }
  .status-dot.dnd{ background:#ed4245; box-shadow:0 0 10px #ed4245; animation:pulse 1.8s ease-in-out infinite; }
  .status-dot.offline{ background:#747f8d; box-shadow:0 0 8px #747f8d; }
 
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.3; }
  }

  .discord-mini{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:14px;
    margin-inline-end:auto;
    width:fit-content;
    max-width:100%;
    text-align:start;
  }

  .mini-avatar-wrap{
    position:relative;
    width:64px;
    height:64px;
    flex-shrink:0;
  }

  .mini-avatar-img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    box-shadow:0 0 0 2px var(--bg-1);
  }

  .mini-avatar-wrap .status-dot{
    position:absolute;
    right:-2px;
    bottom:-2px;
    width:16px;
    height:16px;
    margin:0;
    border:3px solid var(--bg-1);
    box-sizing:content-box;
  }

  .mini-text{
    min-width:0;
    flex:1;
  }

  .mini-name-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .mini-name{
    font-size:15px;
    font-weight:700;
    color:var(--text);
    letter-spacing:0.2px;
  }

  .mini-name-row .badges{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:6px;
    margin-top:0;
    flex-wrap:wrap;
  }

  .mini-name-row .badge{
    width:20px;
    height:20px;
    border-radius:6px;
  }

  .mini-name-row .badge svg{
    width:11px;
    height:11px;
  }
 
  .discord-note{
    margin-top:3px;
    font-size:14px;
    font-weight:500;
    color:var(--text-dim);
    opacity:0;
    transition:opacity .3s ease;
    white-space:normal;
    overflow-wrap:break-word;
    word-break:break-word;
  }
 
  .discord-note.show{ opacity:1; }
 
  .activity-panel{
    display:none;
    align-items:center;
    gap:12px;
    margin-top:14px;
    padding:10px 14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    text-align:start;
  }

  .activity-panel.show{ display:flex; }

  .activity-art{
    width:38px;
    height:38px;
    border-radius:8px;
    flex-shrink:0;
    background:rgba(255,255,255,0.06) center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .activity-art svg{
    width:18px;
    height:18px;
    fill:var(--text-dim);
  }

  .activity-info{
    min-width:0;
    flex:1;
  }

  .activity-kind{
    font-size:10px;
    font-weight:600;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  .activity-name{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .activity-detail{
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:1px;
  }

  .badges{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
 
  .badge{
    width:30px;
    height:30px;
    border-radius:10px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s ease, background .2s ease;
  }
 
  .badge:hover{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.07);
  }
 
  .badge svg{
    width:15px;
    height:15px;
    fill:var(--text-dim);
  }
 
  .badge.nitro{
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.25);
  }
 
  .badge.nitro svg{
    fill:var(--accent);
  }
 
  .info-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
 
  .info-item{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    font-weight:500;
    color:var(--text-dim);
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:12px;
    letter-spacing:0.2px;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s ease, background .2s ease, color .2s ease;
  }
 
  .info-item:hover{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:var(--text);
  }
 
  .info-item svg{
    width:13px;
    height:13px;
    fill:var(--text-dim);
    flex-shrink:0;
  }
 
  #clockTime{
    font-variant-numeric:tabular-nums;
    color:var(--text);
  }
 
  .socials{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:28px;
  }
 
  .social-btn{
    position:relative;
    width:100%;
    height:auto;
    padding:16px 20px;
    border-radius:16px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.025);
    display:flex;
    align-items:center;
    gap:16px;
    cursor:pointer;
    text-decoration:none;
    color:var(--text-dim);
    transition:transform .2s cubic-bezier(.2,.8,.2,1), color .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
  }
 
  .social-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    width:40px;
    height:40px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    transition:background .25s ease;
  }
 
  .social-btn svg{
    width:20px;
    height:20px;
    fill:currentColor;
  }
 
  .social-label{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.3px;
    color:inherit;
  }
 
  .social-btn:hover{
    color:#000;
    background:var(--accent);
    border-color:var(--accent);
    transform:translateX(4px);
    box-shadow:0 14px 30px -10px var(--glow);
  }
 
  .social-btn:hover .social-icon{
    background:rgba(0,0,0,0.12);
  }
 
  .social-btn.copied{
    color:#000;
    background:var(--accent);
    border-color:var(--accent);
  }
 
  .player{
    border:1px solid var(--border);
    border-radius:20px;
    background:rgba(255,255,255,0.025);
    padding:20px 22px 18px;
  }
 
  .player-top{
    display:flex;
    align-items:center;
    gap:16px;
  }
 
  .art-wrap{
    position:relative;
    width:44px;
    height:44px;
    border-radius:12px;
    flex-shrink:0;
    overflow:hidden;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
  }
 
  .song-art{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
 
  .art-wrap.has-art .song-art{ display:block; }
 
  .eq{
    display:flex;
    align-items:flex-end;
    gap:3px;
    width:22px;
    height:20px;
    flex-shrink:0;
  }
 
  .art-wrap.has-art .eq{
    position:absolute;
    right:3px;
    bottom:3px;
    width:15px;
    height:12px;
    gap:2px;
    padding:3px;
    border-radius:6px;
    background:rgba(0,0,0,0.55);
    box-sizing:content-box;
  }
 
  .art-wrap.has-art .eq span{ width:2px; }
 
  .eq span{
    display:block;
    width:3px;
    background:var(--accent);
    border-radius:2px;
    height:40%;
    animation:bounce 1s ease-in-out infinite;
    animation-play-state:paused;
  }
 
  .eq span:nth-child(1){ animation-delay:-.6s; }
  .eq span:nth-child(2){ animation-delay:-.3s; }
  .eq span:nth-child(3){ animation-delay:0s; }
 
  .player.playing .eq span{ animation-play-state:running; }
 
  @keyframes bounce{
    0%,100%{ height:25%; }
    50%{ height:100%; }
  }
 
  .meta{
    flex:1;
    min-width:0;
  }
 
  .meta .title{
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
 
  .meta .artist{
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:3px;
  }
 
  .play-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .2s ease;
  }
 
  .play-btn:hover{ transform:scale(1.08); }
  .play-btn:active{ transform:scale(0.95); }
 
  .play-btn svg{
    width:17px;
    height:17px;
    fill:#000;
  }
 
  .progress-track{
    margin-top:16px;
    height:4px;
    border-radius:4px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    cursor:pointer;
  }
 
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .15s linear;
  }
 
  .volume-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
 
  .volume-icon{
    width:16px;
    height:16px;
    fill:var(--text-dim);
    flex-shrink:0;
  }
 
  .volume-track{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:4px;
    background:rgba(255,255,255,0.08);
    outline:none;
    cursor:pointer;
  }
 
  .volume-track::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    box-shadow:0 0 8px var(--glow);
  }
 
  .volume-track::-moz-range-thumb{
    width:13px;
    height:13px;
    border:none;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    box-shadow:0 0 8px var(--glow);
  }
 
  .site-footer{
    margin-top:22px;
    text-align:center;
    font-size:11px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:rgba(255,255,255,.34);
  }

  @media (max-width:480px){
    .page{ padding:20px 14px; }
    .card{ padding:32px 22px 22px; border-radius:20px; }
    .ring-wrap{ width:180px; height:180px; margin-bottom:20px; }
    .username{ font-size:22px; }
    .discord-note{ font-size:14px; }
    .social-btn{ padding:14px 16px; gap:14px; }
    .social-btn svg{ width:20px; height:20px; }
    .social-label{ font-size:14px; }
    .player{ padding:16px 16px 14px; }
  }
 
  @media (max-width:360px){
    .ring-wrap{ width:150px; height:150px; }
    .info-item{ font-size:11px; padding:6px 10px; }
  }
</style>
</head>
<body>
 
<canvas id="stars"></canvas>
<div class="vignette"></div>
 
<div class="page">
  <div class="card">
 
    <div class="ring-wrap">
      <div class="avatar">
        <img id="mainAvatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230c0c0c'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%23222'/%3E%3Cellipse cx='50' cy='88' rx='32' ry='24' fill='%23222'/%3E%3C/svg%3E" alt="">
      </div>
    </div>
 
    <div class="identity">
      <div class="username"># duskvein</div>

      <div class="discord-mini" id="discordMini">
        <div class="mini-avatar-wrap">
          <img class="mini-avatar-img" id="miniAvatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230c0c0c'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%23222'/%3E%3Cellipse cx='50' cy='88' rx='32' ry='24' fill='%23222'/%3E%3C/svg%3E" alt="">
          <span class="status-dot" id="statusDot"></span>
        </div>
        <div class="mini-text">
          <div class="mini-name-row">
            <span class="mini-name"># duskvein</span>
            <div class="badges" id="badges"></div>
          </div>
          <div class="discord-note" id="discordNote"></div>
        </div>
      </div>

      <div class="activity-panel" id="activityPanel">
        <div class="activity-art" id="activityArt"></div>
        <div class="activity-info">
          <div class="activity-kind" id="activityKind"></div>
          <div class="activity-name" id="activityName"></div>
          <div class="activity-detail" id="activityDetail"></div>
        </div>
      </div>

      <div class="info-row">
        <div class="info-item">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm.75 5v5.4l4.2 2.5-.75 1.25L11 13V7z"/></svg>
          <span id="clockTime">--:--</span>
        </div>
        <div class="info-item">
          <svg viewBox="0 0 24 24"><path d="M12 3a2 2 0 0 1 1.8 2.9c.5.3.9.7 1.2 1.1H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h3a4 4 0 0 1 1.2-1.1A2 2 0 0 1 12 3zm-6 8v6h12v-6H6z"/></svg>
          <span>8 Nov</span>
        </div>
        <div class="info-item">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
          <span>Unknown</span>
        </div>
      </div>
    </div>
 
    <div class="socials">
 
      <a class="social-btn" id="igLink" target="_blank" rel="noopener">
        <span class="social-icon"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.85.07 1.25.06 2.1.25 2.85.55.77.3 1.42.7 2.07 1.35.65.65 1.05 1.3 1.35 2.07.3.75.49 1.6.55 2.85.06 1.25.07 1.65.07 4.85s0 3.6-.07 4.85c-.06 1.25-.25 2.1-.55 2.85-.3.77-.7 1.42-1.35 2.07-.65.65-1.3 1.05-2.07 1.35-.75.3-1.6.49-2.85.55-1.25.06-1.65.07-4.85.07s-3.6 0-4.85-.07c-1.25-.06-2.1-.25-2.85-.55-.77-.3-1.42-.7-2.07-1.35-.65-.65-1.05-1.3-1.35-2.07-.3-.75-.49-1.6-.55-2.85C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.85c.06-1.25.25-2.1.55-2.85.3-.77.7-1.42 1.35-2.07.65-.65 1.3-1.05 2.07-1.35.75-.3 1.6-.49 2.85-.55C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.15 0-3.52 0-4.76.07-1.02.05-1.57.21-1.94.36-.49.19-.84.42-1.2.79-.37.36-.6.71-.79 1.2-.15.37-.31.92-.36 1.94C3.01 8.48 3 8.85 3 12s0 3.52.07 4.76c.05 1.02.21 1.57.36 1.94.19.49.42.84.79 1.2.36.37.71.6 1.2.79.37.15.92.31 1.94.36 1.24.06 1.61.07 4.76.07s3.52 0 4.76-.07c1.02-.05 1.57-.21 1.94-.36.49-.19.84-.42 1.2-.79.37-.36.6-.71.79-1.2.15-.37.31-.92.36-1.94.06-1.24.07-1.61.07-4.76s0-3.52-.07-4.76c-.05-1.02-.21-1.57-.36-1.94-.19-.49-.42-.84-.79-1.2-.36-.37-.71-.6-1.2-.79-.37-.15-.92-.31-1.94-.36C15.52 4 15.15 4 12 4zm0 3.4a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2zm0 1.8a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zm4.85-2.02a1.08 1.08 0 1 1 0 2.15 1.08 1.08 0 0 1 0-2.15z"/></svg></span>
        <span class="social-label">Instagram</span>
      </a>
 
      <a class="social-btn" id="twLink" target="_blank" rel="noopener">
        <span class="social-icon"><svg viewBox="0 0 24 24"><path d="M18.9 2.4h3.3l-7.2 8.24 8.47 11.2H16.9l-5.5-7.2-6.3 7.2H1.8l7.7-8.8L1.4 2.4h6.72l4.98 6.58zM17.7 19.8h1.83L7.4 4.1H5.44z"/></svg></span>
        <span class="social-label">Twitter</span>
      </a>
 
      <a class="social-btn" id="ttLink" target="_blank" rel="noopener">
        <span class="social-icon"><svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.5a3.1 3.1 0 1 1-2.2-2.97V9.2a6.3 6.3 0 1 0 5.4 6.24V8.9a8.1 8.1 0 0 0 4.6 1.44V7.1c-1.7 0-3.2-.7-4.6-2.02z"/></svg></span>
        <span class="social-label">TikTok</span>
      </a>
 
      <button class="social-btn" id="discordBtn" type="button" aria-label="discord">
        <span class="social-icon"><svg viewBox="0 0 24 24"><path d="M20.3 5.4A18 18 0 0 0 15.9 4c-.2.35-.44.83-.6 1.2a16.7 16.7 0 0 0-6.6 0c-.16-.37-.4-.85-.6-1.2a18 18 0 0 0-4.4 1.4C1.2 9.6.5 13.6.8 17.6a18.1 18.1 0 0 0 5.5 2.8c.44-.6.84-1.25 1.18-1.93-.65-.25-1.27-.55-1.86-.9.16-.12.31-.24.46-.37 3.6 1.68 7.5 1.68 11.06 0 .15.13.3.25.46.37-.59.35-1.21.65-1.86.9.34.68.74 1.33 1.18 1.93 2.05-.62 4-1.55 5.5-2.8.36-4.65-.8-8.6-2.62-12.2zM8.7 15.15c-.94 0-1.7-.86-1.7-1.93 0-1.06.75-1.93 1.7-1.93.96 0 1.72.87 1.7 1.93 0 1.07-.74 1.93-1.7 1.93zm6.6 0c-.94 0-1.7-.86-1.7-1.93 0-1.06.75-1.93 1.7-1.93.96 0 1.72.87 1.7 1.93 0 1.07-.74 1.93-1.7 1.93z"/></svg></span>
        <span class="social-label">Discord</span>
      </button>
 
    </div>
 
    <div class="player" id="player">
      <div class="player-top">
        <div class="art-wrap" id="artWrap">
          <img class="song-art" id="songArt" alt="">
          <div class="eq"><span></span><span></span><span></span></div>
        </div>
        <div class="meta">
          <div class="title" id="songTitle">SONG NAME</div>
          <div class="artist" id="songArtist">ARTIST NAME</div>
        </div>
        <button class="play-btn" id="playBtn" type="button" aria-label="play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      <div class="volume-row">
        <svg class="volume-icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 15.5 12z"/></svg>
        <input type="range" class="volume-track" id="volumeSlider" min="0" max="100" value="70">
      </div>
    </div>

    <footer class="site-footer">© 2026 # duskvein — All rights reserved.</footer>
 
  </div>
</div>
 
<audio id="audio" src="song.mp3" loop preload="auto"></audio>
 
<script src="secret.js"></script>
<script>
  const PLACEHOLDER_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230c0c0c'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%23222'/%3E%3Cellipse cx='50' cy='88' rx='32' ry='24' fill='%23222'/%3E%3C/svg%3E";
  let localAvatar = CONFIG.avatar && CONFIG.avatar.trim();
  if(localAvatar){
    const localAvatarImages = [
      document.getElementById('mainAvatarImg'),
      document.getElementById('miniAvatarImg')
    ];
    localAvatarImages.forEach((image) => {
      image.addEventListener('error', () => {
        if(localAvatar === image.getAttribute('src')){
          localAvatar = '';
          document.getElementById('mainAvatarImg').src = PLACEHOLDER_AVATAR;
          document.getElementById('miniAvatarImg').src = PLACEHOLDER_AVATAR;
          updateDiscordStatus();
        }
      }, { once: true });
      image.src = localAvatar;
    });
  }

  document.getElementById('songTitle').textContent  = CONFIG.songTitle;
  document.getElementById('songArtist').textContent = CONFIG.songArtist;
  if(CONFIG.songArt && CONFIG.songArt.trim()){
    const songArtImg = document.getElementById('songArt');
    const artWrapEl = document.getElementById('artWrap');
    songArtImg.onload = () => artWrapEl.classList.add('has-art');
    songArtImg.onerror = () => artWrapEl.classList.remove('has-art');
    songArtImg.src = CONFIG.songArt.trim();
  }
  document.getElementById('igLink').href = CONFIG.socials.instagram;
  document.getElementById('twLink').href = CONFIG.socials.twitter;
  document.getElementById('ttLink').href = CONFIG.socials.tiktok;
 
  const clockEl = document.getElementById('clockTime');
  function updateClock(){
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('en-US', {
      timeZone: 'Asia/Riyadh',
      hour: '2-digit',
      minute: '2-digit'
    });
  }
  updateClock();
  setInterval(updateClock, 1000);
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let dust = [];

  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const starCount = Math.floor((innerWidth * innerHeight) / 6500);
    const dustCount = Math.max(10, Math.floor((innerWidth * innerHeight) / 70000));

    stars = Array.from({length: starCount}, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.35 + .18,
      a: Math.random() * Math.PI * 2,
      s: Math.random() * .018 + .004,
      drift: Math.random() * .08 + .015
    }));

    dust = Array.from({length: dustCount}, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 110 + 55,
      vx: (Math.random() - .5) * .08,
      vy: (Math.random() - .5) * .06,
      a: Math.random() * .035 + .012,
      hue: '255,255,255'
    }));
  }

  resize();
  addEventListener('resize', resize);

  function drawVoid(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    for(const cloud of dust){
      cloud.x += cloud.vx;
      cloud.y += cloud.vy;
      if(cloud.x < -cloud.r) cloud.x = innerWidth + cloud.r;
      if(cloud.x > innerWidth + cloud.r) cloud.x = -cloud.r;
      if(cloud.y < -cloud.r) cloud.y = innerHeight + cloud.r;
      if(cloud.y > innerHeight + cloud.r) cloud.y = -cloud.r;

      const g = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
      g.addColorStop(0, `rgba(${cloud.hue},${cloud.a})`);
      g.addColorStop(1, `rgba(${cloud.hue},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for(const st of stars){
      st.a += st.s;
      st.y += st.drift;
      if(st.y > innerHeight + 2){ st.y = -2; st.x = Math.random() * innerWidth; }
      const alpha = .18 + Math.abs(Math.sin(st.a)) * .72;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(235,242,255,${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(drawVoid);
  }

  drawVoid();
 
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const player = document.getElementById('player');
  const progressFill = document.getElementById('progressFill');
  const progressTrack = document.getElementById('progressTrack');
  const volumeSlider = document.getElementById('volumeSlider');
 
  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
 
  audio.volume = volumeSlider.value / 100;
 
  function playAudio(){
    audio.play();
    playIcon.innerHTML = ICON_PAUSE;
    player.classList.add('playing');
  }
 
  function pauseAudio(){
    audio.pause();
    playIcon.innerHTML = ICON_PLAY;
    player.classList.remove('playing');
  }
 
  playBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audio.paused ? playAudio() : pauseAudio();
  });
 
  audio.addEventListener('timeupdate', () => {
    if(audio.duration){
      progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
  });
 
  progressTrack.addEventListener('click', (e) => {
    e.stopPropagation();
    const rect = progressTrack.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if(audio.duration){ audio.currentTime = ratio * audio.duration; }
  });
 
  volumeSlider.addEventListener('input', (e) => {
    e.stopPropagation();
    audio.volume = volumeSlider.value / 100;
  });
  volumeSlider.addEventListener('click', (e) => e.stopPropagation());
 
  function unlockAudio(){
    if(audio.paused){ playAudio(); }
    document.removeEventListener('click', unlockAudio);
    document.removeEventListener('touchstart', unlockAudio);
  }
  document.addEventListener('click', unlockAudio);
  document.addEventListener('touchstart', unlockAudio);
 
  const statusDot = document.getElementById('statusDot');
  const discordNote = document.getElementById('discordNote');
  const miniAvatarImg = document.getElementById('miniAvatarImg');
  const mainAvatarImg = document.getElementById('mainAvatarImg');
  const badgesEl = document.getElementById('badges');
  const activityPanel = document.getElementById('activityPanel');
  const activityArt = document.getElementById('activityArt');
  const activityKind = document.getElementById('activityKind');
  const activityName = document.getElementById('activityName');
  const activityDetail = document.getElementById('activityDetail');

  const ICON_GAME = '<svg viewBox="0 0 24 24"><path d="M7 7h10a4 4 0 0 1 4 4l1 5a2.4 2.4 0 0 1-4.3 1.9L16 16H8l-1.7 1.9A2.4 2.4 0 0 1 2 16l1-5a4 4 0 0 1 4-4zm1.5 3v1.5H7V13h1.5v1.5H10V13h1.5v-1.5H10V10z"/></svg>';
  const ICON_HEADPHONES = '<svg viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8v6a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H5v-1a7 7 0 0 1 14 0v1h-2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-6a8 8 0 0 0-8-8z"/></svg>';

  function renderActivity(data){
    const spotify = data.listening_to_spotify ? data.spotify : null;
    const game = (data.activities || []).find(a => a.type === 0);

    if(spotify){
      activityPanel.classList.add('show');
      if(spotify.album_art_url){
        activityArt.innerHTML = '';
        activityArt.style.backgroundImage = `url(${spotify.album_art_url})`;
      } else {
        activityArt.style.backgroundImage = 'none';
        activityArt.innerHTML = ICON_HEADPHONES;
      }
      activityKind.textContent = 'Listening to Spotify';
      activityName.textContent = spotify.song || '';
      activityDetail.textContent = spotify.artist || '';
    } else if(game){
      activityPanel.classList.add('show');
      activityArt.style.backgroundImage = 'none';
      activityArt.innerHTML = ICON_GAME;
      activityKind.textContent = 'Playing';
      activityName.textContent = game.name || '';
      activityDetail.textContent = game.details || game.state || '';
    } else {
      activityPanel.classList.remove('show');
    }
  }
 
  const BADGE_ICONS = {
    nitro:  '<path d="M12 2l3.5 6.2L22 9l-5 4.8 1.3 7.2L12 17.8 5.7 21l1.3-7.2L2 9l6.5-.8z"/>',
    boost:  '<path d="M12 2l6 10h-4v10h-4V12H6z"/>',
    partner:'<path d="M12 2l8 3.5v5.6C20 16.6 16.6 20.4 12 22c-4.6-1.6-8-5.4-8-10.9V5.5z"/>',
    hypesquad:'<path d="M12 2l9 9-9 9-9-9z"/>',
    bughunter:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#000"/>',
    early:  '<path d="M12 21s-8-4.9-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.1-8 11-8 11z"/>',
    dev:    '<path d="M8 6L2 12l6 6 1.4-1.4L4.8 12l4.6-4.6zm8 0l-1.4 1.4 4.6 4.6-4.6 4.6L16 18l6-6z"/>',
    mod:    '<path d="M12 2l8 3.5v5.6C20 16.6 16.6 20.4 12 22c-4.6-1.6-8-5.4-8-10.9V5.5z"/><path d="M9 12l2 2 4-4" stroke="#000" stroke-width="1.6" fill="none"/>'
  };
 
  function addBadge(type){
    const b = document.createElement('div');
    b.className = 'badge' + (type === 'nitro' ? ' nitro' : '');
    b.innerHTML = `<svg viewBox="0 0 24 24">${BADGE_ICONS[type]}</svg>`;
    badgesEl.appendChild(b);
  }
 
  function renderBadges(publicFlags){
    badgesEl.innerHTML = '';
 
    if(CONFIG.badges?.nitro) addBadge('nitro');
    if(CONFIG.badges?.boost) addBadge('boost');
 
    const flags = publicFlags || 0;
    if(flags & (1 << 1))  addBadge('partner');
    if(flags & (1 << 2))  addBadge('hypesquad');
    if(flags & (1 << 3))  addBadge('bughunter');
    if(flags & (1 << 9))  addBadge('early');
    if(flags & (1 << 17)) addBadge('dev');
    if(flags & (1 << 18)) addBadge('mod');
  }
 
  async function updateDiscordStatus(){
    try{
      const res = await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.discordId}`);
      const json = await res.json();
 
      if(!json.success){ throw new Error('lanyard not tracking this id'); }
 
      const status = json.data.discord_status || 'offline';
      statusDot.classList.remove('online','idle','dnd','offline');
      statusDot.classList.add(status);

      const du = json.data.discord_user;
      if(!localAvatar && du && du.avatar){
        const ext = du.avatar.startsWith('a_') ? 'gif' : 'png';
        const url = `https://cdn.discordapp.com/avatars/${du.id}/${du.avatar}.${ext}?size=256`;
        miniAvatarImg.src = url;
        mainAvatarImg.src = url;
      } else if(!localAvatar) {
        miniAvatarImg.src = PLACEHOLDER_AVATAR;
        mainAvatarImg.src = PLACEHOLDER_AVATAR;
      }
 
      const activities = json.data.activities || [];
      const custom = activities.find(a => a.type === 4);
      const noteText = custom ? [custom.emoji ? custom.emoji.name : '', custom.state || ''].filter(Boolean).join(' ') : '';
 
      if(noteText){
        discordNote.textContent = noteText;
        discordNote.classList.add('show');
      } else {
        discordNote.classList.remove('show');
      }
 
      renderBadges(json.data.discord_user?.public_flags);
      renderActivity(json.data);
    }catch(e){
      statusDot.classList.remove('online','idle','dnd');
      statusDot.classList.add('offline');
      discordNote.classList.remove('show');
      activityPanel.classList.remove('show');
      renderBadges(0);
    }
  }
 
  updateDiscordStatus();
  setInterval(updateDiscordStatus, 15000);
 
  const discordBtn = document.getElementById('discordBtn');
 
  discordBtn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(CONFIG.discordId);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = CONFIG.discordId;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    discordBtn.classList.add('copied');
    setTimeout(() => discordBtn.classList.remove('copied'), 1500);
  });
</script>
 
</body>
</html>
